# Genera la animación de la serpiente con la paleta del portafolio y la publica en la rama "output".
# Copiar a .github/workflows/snake.yml en el repositorio devMiguelGuevara/devMiguelGuevara.
name: Snake de contribuciones

on:
  schedule:
    - cron: "0 6 * * *" # todos los días a la 1 a. m. hora de Colombia
  workflow_dispatch: # permite ejecutarla a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Serpiente naranja; cuadros de papel → lila → cobalto → tinta
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff5b22&color_dots=#ebe8e1,#c9b8ff,#8f7cf0,#2e46f0,#151513

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
